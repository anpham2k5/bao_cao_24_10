[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8
framework = arduino
monitor_speed = 115200
upload_protocol = custom
upload_command = "C:\Program Files (x86)\STMicroelectronics\STM32 ST-LINK Utility\ST-LINK Utility\ST-LINK_CLI.exe" -c SWD -P $SOURCE 0x08000000 -V -Rst -Q
build_flags = 
    -D SERIAL_UART_INSTANCE=1
    -D PIN_SERIAL_TX=PA9
    -D PIN_SERIAL_RX=PA10